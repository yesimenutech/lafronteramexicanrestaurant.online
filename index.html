<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="La Frontera Mexican Restaurant - Authentic Tex-Mex Cuisine in Columbus, MS. Bold flavors, fresh ingredients, and memorable dining experiences.">
    <meta name="keywords" content="Mexican Restaurant, Tex-Mex, Columbus MS, Food Delivery, Tacos, Authentic Mexican Food">
    <meta property="og:title" content="La Frontera Mexican Restaurant | Authentic Tex-Mex">

    <title>La Frontera Mexican Restaurant | Tex-Mex Cuisine</title>
    <link rel="icon" id="favicon" type="image/png" href="https://res.cloudinary.com/dzklt0a5u/image/upload/f_auto,q_auto:eco,dpr_auto,w_250/v1787675264/LaFronteraMexRestLOGO_vattq1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

      },
      "telephone": "662-798-0914",
      "servesCuisine": "Tex-Mex, Mexican",
      "priceRange": "$$"
    }
    </script>

    <style>
        :root {
            --color-primary: #D4AF37; /* Oro / Mostaza */
            --color-primary-hover: #b5952f;
            --color-bg-main: #0D0D0D; /* Negro Profundo */
            --color-bg-secondary: #1A1A1A; /* Gris oscuro para contraste sutil */
            --color-bg-card: #2C2C2C; /* Gris Carbón */
            --color-text-main: #E0E0E0; /* Plata / Gris Claro */
            --color-text-muted: #A0A0A0;
            --color-border: #4A4A4A;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--color-bg-main);
        }

        body {
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.7;
            color: var(--color-text-main);
            background-color: var(--color-bg-main);
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, #1a1a1a 0%, #0D0D0D 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: color 0.3s ease;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            color: var(--color-primary);
            font-weight: 600;
            line-height: 1.2;
        }

        .section-title {
            font-size: 46px;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            letter-spacing: 1px;
        }

        .section-title.centered {
            text-align: center;
            display: block;
        }

        .section-subtitle-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .section-subtitle-container.centered {
            justify-content: center;
        }

        .line-small {
            width: 40px;
            height: 1px;
            background-color: var(--color-primary);
        }

        .section-subtitle {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--color-text-muted);
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            padding: 25px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            transition: all 0.4s ease;
        }

        .navbar.scrolled {
            padding: 15px 0;
            background-color: rgba(13, 13, 13, 0.98);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-family: var(--font-heading);
            font-size: 26px;
            color: var(--color-primary);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 45px;
            align-items: center;
        }

        .nav-link {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--color-text-main);
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 5px;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background-color: var(--color-primary);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .nav-link:hover {
            color: var(--color-primary);
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 20px;
            border-left: 1px solid var(--color-border);
            padding-left: 35px;
        }

        .lang-btn {
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--color-text-muted);
            transition: color 0.3s ease;
            text-transform: uppercase;
        }

        .lang-btn.active {
            color: var(--color-primary);
        }

        .navbar-toggler {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .toggler-icon {
            display: block;
            width: 30px;
            height: 2px;
            background-color: var(--color-primary);
            margin: 6px 0;
            transition: all 0.3s ease;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 42px;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 1px solid var(--color-primary);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
            text-align: center;
            border-radius: 2px;
        }

        .btn-filled {
            background-color: var(--color-primary);
            color: var(--color-bg-main);
        }

        .btn-filled::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--color-bg-card);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: -1;
        }

        .btn-filled:hover {
            color: var(--color-primary);
            border-color: var(--color-bg-card);
        }

        .btn-filled:hover::before {
            transform: scaleY(1);
            transform-origin: top;
        }
        
        .menutech-btn-wrapper {
            display: none !important;
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 100vh;
            min-height: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg-main);
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* Fallback background image just in case JS fails */
        #hero-section {
            background-image: url('https://res.cloudinary.com/dzklt0a5u/image/upload/f_auto,q_auto:eco,w_1600/v1787674376/fachada_la_frontera_owhmci.png');
        }

        .hero-noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            z-index: 1;
            pointer-events: none;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(13,13,13,0.92) 0%, rgba(44,44,44,0.4) 50%, rgba(13,13,13,0.95) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 800px;
            padding: 70px 50px;
            margin-top: 50px;
            background: rgba(13, 13, 13, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        /* Decorative Corners */
        .hero-content::before, .hero-content::after {
            content: '';
            position: absolute;
            width: 40px; height: 40px;
            border: 1px solid var(--color-primary);
            opacity: 0.7;
        }
        .hero-content::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .hero-content::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .hero-badge {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--color-primary);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 16px;
            margin-bottom: 30px;
            border-radius: 20px;
        }

        .hero-logo {
            max-height: 180px;
            width: auto;
            margin: 0 auto 35px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
            transform: scale(1);
            transition: transform 0.5s ease;
        }

        .hero-logo:hover {
            transform: scale(1.05);
        }

        .hero-address {
            font-family: var(--font-body);
            font-size: 14px;
            letter-spacing: 2.5px;
            color: var(--color-text-main);
            margin-bottom: 45px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .hero-address::before, .hero-address::after {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background-color: var(--color-border);
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--color-text-muted);
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        .scroll-indicator .mouse {
            width: 24px;
            height: 36px;
            border: 1px solid var(--color-primary);
            border-radius: 12px;
            position: relative;
        }

        .scroll-indicator .wheel {
            width: 2px;
            height: 6px;
            background-color: var(--color-primary);
            border-radius: 2px;
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            animation: scrollWheel 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -10px); }
            60% { transform: translate(-50%, -5px); }
        }

        @keyframes scrollWheel {
            0% { top: 6px; opacity: 1; }
            100% { top: 20px; opacity: 0; }
        }

        /* About Section */
        .about-section {
            padding: 140px 0;
            background-color: var(--color-bg-main);
            position: relative;
        }
        
        .texmex-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 20L15 0L30 20L45 0L60 20' fill='none' stroke='%23D4AF37' stroke-width='1' opacity='0.2'/%3E%3C/svg%3E");
            background-repeat: repeat-x;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .about-text p {
            color: var(--color-text-muted);
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: 300;
        }

        .about-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            position: relative;
        }

        .about-images::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            right: 30px;
            bottom: 30px;
            border: 1px solid var(--color-primary);
            z-index: 0;
            opacity: 0.3;
        }

        .about-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
            position: relative;
            z-index: 1;
            filter: grayscale(30%) contrast(110%);
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .about-image:hover {
            filter: grayscale(0%) contrast(100%);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 2;
        }

        .about-image:nth-child(2) {
            transform: translateY(50px);
        }
        .about-image:nth-child(2):hover {
            transform: translateY(40px);
        }

        /* Gallery Section */
        .gallery-section {
            padding: 140px 0;
            background-color: var(--color-bg-secondary);
            position: relative;
        }

        .gallery-section::before, .gallery-section::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent);
        }
        .gallery-section::before { top: 0; }
        .gallery-section::after { bottom: 0; }

        #gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 60px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background-color: var(--color-bg-main);
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .gallery-item:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
            filter: brightness(0.8) contrast(110%);
        }

        .gallery-item:hover .gallery-img {
            transform: scale(1.15);
            filter: brightness(1.1) contrast(120%);
        }

        /* Info Section */
        .info-section {
            padding: 140px 0;
            background-color: var(--color-bg-main);
            position: relative;
        }

        .info-box {
            background: var(--color-bg-card);
            padding: 80px 60px;
            position: relative;
            border-top: 3px solid var(--color-primary);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .info-box::after {
            content: '';
            position: absolute;
            top: -3px; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0 20h2v20H0V20zm4 0h2v20H4V20zm4 0h2v20H8V20zm4 0h2v20h-2V20zm4 0h2v20h-2V20zm4 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2zm0 4h20v2H20v-2z' fill='%23D4AF37' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
            margin-top: 70px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .info-item h4 {
            font-size: 22px;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            color: var(--color-primary);
            font-family: var(--font-heading);
        }

        .info-item p {
            color: var(--color-text-muted);
            font-size: 15px;
            line-height: 1.8;
            font-weight: 300;
        }

        /* Footer */
        .site-footer {
            background-color: #151515;
            padding: 90px 0 40px;
            position: relative;
        }
        
        .site-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background-color: var(--color-primary);
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 80px;
            max-width: 900px;
            margin: 0 auto 70px;
            text-align: center;
        }

        .footer-title {
            font-size: 24px;
            color: var(--color-text-main);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .footer-col p {
            font-size: 14px;
            color: var(--color-text-muted);
            margin-bottom: 12px;
            font-weight: 300;
        }

        .social-icons-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 35px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border-radius: 50%;
        }

        .social-link:hover {
            border-color: var(--color-primary);
            color: var(--color-bg-main);
            background-color: var(--color-primary);
            transform: translateY(-5px);
        }

        .footer-bottom {
            text-align: center;
            font-size: 13px;
            color: var(--color-text-muted);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 35px;
            letter-spacing: 1.5px;
        }
        
        .footer-bottom a {
            color: var(--color-primary);
            font-weight: 500;
            transition: color 0.3s;
        }
        .footer-bottom a:hover {
            color: var(--color-primary-hover);
        }

        /* Responsive */
        @media (max-width: 992px) {
            .about-grid { grid-template-columns: 1fr; gap: 60px; }
            .about-images { max-width: 650px; margin: 50px auto 0; }
            .info-grid { grid-template-columns: 1fr; gap: 50px; }
            .footer-grid { grid-template-columns: 1fr; gap: 50px; }
            .hero-content { padding: 50px 30px; }
            .section-title { font-size: 38px; }
        }

        @media (max-width: 768px) {
            .navbar-toggler { display: block; }
            .nav-menu {
                position: fixed;
                top: 76px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 76px);
                background-color: rgba(13, 13, 13, 0.98);
                backdrop-filter: blur(10px);
                flex-direction: column;
                justify-content: center;
                transition: left 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            }
            .nav-menu.active { left: 0; }
            .lang-switch { border-left: none; padding-left: 0; margin: 20px 0 0 0; }
            .hero-address { font-size: 11px; flex-direction: column; }
            .hero-address::before, .hero-address::after { display: none; }
            .about-images { grid-template-columns: 1fr; }
            .about-image:nth-child(2) { display: none; }
            .info-box { padding: 50px 25px; }
            .hero-content { border: none; background: transparent; box-shadow: none; padding: 20px; }
            .hero-content::before, .hero-content::after { display: none; }
        }

        /* Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.9s cubic-bezier(0.165, 0.84, 0.44, 1), transform 0.9s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--color-bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }
    </style>

    <script>
        // State Mocking
        window.MENU_TECH_STATE = {
            "lang":"en",
            "showReservations":false,
            "showAbout":true,
            "showPromo":false,
            "showGallery":true,
            "showCatering":false,
            "showInfo":true,

    <!-- App Scripts -->
    <script>
        const optimizeCloudinaryUrl = (url, options = {}) => {
            if (!url || typeof url !== 'string' || !url.includes('res.cloudinary.com')) return url;
            const [baseUrl, hash] = url.split('#');
            if (!baseUrl.includes('/upload/')) return url;
            const parts = baseUrl.split('/upload/');
            let pathSegments = parts[1].split('/');
            
            if (pathSegments.length > 1) {
                const firstSegment = pathSegments[0];
                const isVersion = /^v\d+$/.test(firstSegment);
                const isTransformation = !isVersion && (firstSegment.includes('_') || firstSegment.includes(','));
                if (isTransformation) pathSegments.shift(); 
            }
            const cleanPath = pathSegments.join('/');

            let transformations = ['f_auto', 'q_auto:eco', 'dpr_auto'];
            if (options.width) transformations.push(`w_${options.width}`);
            else transformations.push('w_600');
            if (options.height) transformations.push(`h_${options.height}`);
            if (options.crop) transformations.push(`c_${options.crop}`);
            
            return `${parts[0]}/upload/${transformations.join(',')}/${cleanPath}${hash ? '#'+hash : ''}`;
        };

        const SOCIAL_ICONS = {
            instagram: `<svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>`,
            facebook: `<svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.22 5.96C15.31 5.96 16.45 6.15 16.45 6.15V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V21.96A10 10 0 0 0 22 12.06C22 6.53 17.5 2.04 12 2.04Z"/></svg>`,
            tiktok: `<svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.04.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93v7.2c0 1.63-.4 3.31-1.37 4.67-1.07 1.5-2.73 2.5-4.56 2.8-1.85.31-3.83.07-5.46-.8-1.64-.88-2.86-2.4-3.39-4.2-.5-1.7-.26-3.6.59-5.15.88-1.58 2.4-2.76 4.16-3.23 1.78-.47 3.74-.23 5.37.59v4.14c-1.12-.55-2.48-.6-3.56-.05-.88.45-1.45 1.34-1.57 2.33-.14 1.09.42 2.2 1.33 2.75.98.6 2.25.64 3.25.13 1.02-.51 1.7-1.55 1.75-2.71V.02z"/></svg>`,
            twitter: `<svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98-3.56-.18-6.73-1.89-8.84-4.48-.37.63-.58 1.37-.58 2.15 0 1.48.75 2.78 1.89 3.55-.7 0-1.36-.21-1.94-.53v.05c0 2.05 1.45 3.78 3.39 4.17-.36.1-.74.15-1.13.15-.27 0-.54-.03-.8-.08.54 1.68 2.11 2.9 3.97 2.93-1.46 1.14-3.29 1.82-5.3 1.82-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23Z"/></svg>`
        };

        let currentLang = 'en';
        let originalContent = {};

        function applyLanguage(lang) {
            currentLang = lang;
            
            document.getElementById('lang-es').classList.toggle('active', lang === 'es');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            
            document.querySelectorAll('[data-translate-key]').forEach(el => {
                const key = el.getAttribute('data-translate-key');
                if(lang === 'es' && STATIC_TRANSLATIONS[key]) {
                    if(!originalContent[key]) originalContent[key] = el.innerHTML;
                    el.innerHTML = STATIC_TRANSLATIONS[key];
                } else {
                    if(originalContent[key]) el.innerHTML = originalContent[key];
                }
            });

            const phoneEl = document.getElementById('footer-phone');
            if(phoneEl && window.MENU_TECH_STATE && window.MENU_TECH_STATE.info) {
                phoneEl.textContent = (lang === 'es' ? 'Teléfono: ' : 'Phone: ') + window.MENU_TECH_STATE.info.phone;
            }
        }

        function updateUI(data) {
            if (!data) return;

            if (data.title) {
                const brand = document.getElementById('nav-brand');
                if(brand) brand.textContent = data.title.split(' ')[0] + ' ' + (data.title.split(' ')[1] || '');
            }

            if (data.logoImg) {
                const logo = document.getElementById('hero-logo');
                const fav = document.getElementById('favicon');
                const optLogo = optimizeCloudinaryUrl(data.logoImg, { width: 450 });
                if (logo) logo.src = optLogo;
                if (fav) fav.href = optLogo;
            }

            if (data.heroAddress !== undefined) {
                const addr = document.getElementById('hero-address');
                if (addr) addr.textContent = data.heroAddress;
            }

            const sections = {
                'about-section': data.showAbout !== false,
                'gallery-section': data.showGallery !== false,
                'info-section': data.showInfo !== false
            };
            Object.keys(sections).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = sections[id] ? '' : 'none';
            });

            // Updating Hero Background dynamically 
            if (data.heroImg) {
                const hero = document.getElementById('hero-section');
                if (hero) hero.style.backgroundImage = `url('${optimizeCloudinaryUrl(data.heroImg, { width: 1800 })}')`;
            }

            if (data.aboutImg1) document.getElementById('about-img-1').src = optimizeCloudinaryUrl(data.aboutImg1, { width: 800 });
            if (data.aboutImg2) document.getElementById('about-img-2').src = optimizeCloudinaryUrl(data.aboutImg2, { width: 800 });

            if (data.info) {
                const formatText = t => (t||'').replace(/\n/g, '<br>');
                document.getElementById('info-hours').innerHTML = formatText(data.info.hours);
                document.getElementById('info-phone').textContent = data.info.phone || '';
                document.getElementById('info-address').textContent = data.info.address || '';
                
                document.getElementById('footer-hours').innerHTML = formatText(data.info.hours);
                document.getElementById('footer-address').textContent = data.info.address || '';
            }

            if (data.socials) {
                const c = document.getElementById('social-icons');
                if (c) {
                    c.innerHTML = data.socials.map(s => {
                        let platform = s.platform;
                        if(platform === 'twitter') platform = 'tiktok';
                        return `
                        <a href="${s.url}" target="_blank" class="social-link" aria-label="${platform}">
                            ${SOCIAL_ICONS[platform] || SOCIAL_ICONS.instagram}
                        </a>
                    `}).join('');
                }
            }

            if (data.gallery && data.gallery.length > 0) {
                const c = document.getElementById('gallery-container');
                if (c) {
                    c.innerHTML = data.gallery.map(img => `
                        <div class="gallery-item">
                            <img src="${optimizeCloudinaryUrl(img, { width: 600, height: 600, crop: 'fill' })}" class="gallery-img" loading="lazy" alt="Tex Mex Dish">
                        </div>
                    `).join('');
                }
            }

            if (data.titles) {
                Object.keys(data.titles).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.setAttribute('data-translate-key', data.titles[id]);
                        el.innerHTML = data.titles[id];
                    }
                });
            }

            if (data.paragraphs && data.paragraphs.about) {
                const segments = data.paragraphs.about.split('\n\n');
                ['about-p1', 'about-p2', 'about-p3'].forEach((id, i) => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.textContent = segments[i] || "";
                        el.style.display = segments[i] ? "" : "none";
                    }
                });
            }
            
            applyLanguage(currentLang);
        }

        window.addEventListener('message', (event) => {
            if (event.data.type === 'UPDATE_CONTENT') {
                updateUI(event.data.data);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (window.MENU_TECH_STATE) {
                updateUI(window.MENU_TECH_STATE);
            }

            document.getElementById('lang-es').addEventListener('click', () => applyLanguage('es'));
            document.getElementById('lang-en').addEventListener('click', () => applyLanguage('en'));

            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 80) navbar.classList.add('scrolled');
                else navbar.classList.remove('scrolled');
            });

            const toggler = document.getElementById('navbar-toggler');
            const menu = document.getElementById('nav-menu');
            toggler.addEventListener('click', () => menu.classList.toggle('active'));
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => menu.classList.remove('active'));
            });

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if(entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });

            document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
        });
    </script>
